name: KP Recap Studio APK Build
on:
  push:
    branches: [feat/kp-recap-ci-check]
    paths:
      - 'kp-recap-studio/**'
      - '.github/workflows/kp-recap-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kp-recap-studio/**'
      - '.github/workflows/kp-recap-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK setup (v4 fixes removed tools package)
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile debug APK
        working-directory: kp-recap-studio
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate APK
        run: |
          APK=kp-recap-studio/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 15
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: KP-Recap-Studio-TEST-APK
          path: kp-recap-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download Android test APK
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=kp-recap-studio/app/build/outputs/apk/debug/app-debug.apk
          NAME=KP-Recap-Studio-Android15-v0.5-Test.apk
          cp "$APK" "$NAME"
          TAG=kp-recap-v0.5-alpha
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "KP Recap Studio v0.5 ALPHA TEST" --target feat/kp-recap-ci-check \
              --notes "For Android 8+ including vivo V27. This is a DEBUG TEST build, not a finished app. Whisper model (~75 MB) must be obtained separately. Cloudflare Myanmar translation backend is not yet deployed; real-device feature QA remains pending."
          fi
          gh release upload "$TAG" "$NAME" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
